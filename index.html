<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Complete The Words — 托福必備高頻字彙</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#0E1520;
  --ground-2:#131C2B;
  --card:#1A2434;
  --card-2:#212D40;
  --line:#2C3A50;
  --ink:#E9EEF6;
  --ink-dim:#93A3B8;
  --ink-faint:#63748C;
  --gold:#F0C05A;
  --gold-soft:#F0C05A22;
  --green:#5FD3A6;
  --red:#FF8172;
  --radius:14px;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:"Noto Sans TC",system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:"Instrument Serif",Georgia,"Songti TC",serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(1100px 600px at 50% -12%, #1B2740 0%, transparent 62%),
    var(--ground);
  color:var(--ink);
  font-family:var(--sans);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}
.wrap{max-width:880px;margin:0 auto;padding:20px 16px 64px}

/* ---------- header ---------- */
header{margin-bottom:18px}
.eyebrow{
  font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--ink-faint);margin:0 0 6px
}
h1{
  font-family:var(--serif);font-weight:400;font-size:clamp(30px,6vw,44px);
  margin:0 0 2px;letter-spacing:.01em;line-height:1.1
}
h1 em{font-style:italic;color:var(--gold)}
.sub{color:var(--ink-dim);font-size:13px;margin:6px 0 0}

/* ---------- progress ---------- */
.meter{margin-top:16px}
.meter-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:7px}
.meter-pct{font-family:var(--mono);font-size:13px;color:var(--gold);letter-spacing:.04em}
.meter-label{font-size:12px;color:var(--ink-faint);font-family:var(--mono);letter-spacing:.08em}
.bar{height:7px;border-radius:99px;background:#101927;overflow:hidden;display:flex;border:1px solid var(--line)}
.bar i{display:block;height:100%;transition:width .45s cubic-bezier(.2,.8,.2,1)}
.bar .b-mastered{background:linear-gradient(90deg,#4FBF95,var(--green))}
.bar .b-review{background:#8A5F3C}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:9px;font-size:12px;color:var(--ink-dim)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:99px;display:inline-block}
.dot.m{background:var(--green)}.dot.r{background:#A9743F}.dot.n{background:#33425A}

/* ---------- controls ---------- */
.controls{
  margin:20px 0 16px;padding:14px;border:1px solid var(--line);border-radius:var(--radius);
  background:linear-gradient(180deg,var(--ground-2),#111A28)
}
.ctl-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ctl-row + .ctl-row{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.ctl-label{
  font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-faint);width:100%;margin-bottom:-2px
}
.chip{
  appearance:none;border:1px solid var(--line);background:#16202F;color:var(--ink-dim);
  font-family:var(--sans);font-size:13px;padding:7px 13px;border-radius:99px;cursor:pointer;
  transition:.15s;line-height:1.2
}
.chip:hover{border-color:#41536E;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#171003;font-weight:500}
select{
  appearance:none;border:1px solid var(--line);background:#16202F;color:var(--ink);
  font-family:var(--sans);font-size:13px;padding:7px 30px 7px 12px;border-radius:99px;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink-dim) 50%),linear-gradient(135deg,var(--ink-dim) 50%,transparent 50%);
  background-position:calc(100% - 15px) 51%,calc(100% - 10px) 51%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat
}
select:focus-visible,.chip:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* ---------- card ---------- */
.card{
  border:1px solid var(--line);border-radius:var(--radius);background:var(--card);
  padding:22px 20px 20px;position:relative;overflow:hidden
}
.card::before{
  content:"";position:absolute;inset:0 0 auto;height:2px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.5
}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}
.counter{font-family:var(--mono);font-size:12px;color:var(--ink-faint);letter-spacing:.06em}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{
  font-size:11px;padding:3px 9px;border-radius:99px;border:1px solid var(--line);
  color:var(--ink-dim);background:#16202F;font-family:var(--mono);letter-spacing:.05em
}
.tag.tag-hl{color:#171003;background:var(--gold);border-color:var(--gold);font-weight:500}
.sentence.real{font-size:15.5px;color:var(--ink);border-left-color:var(--gold)}
.tag.state-2{color:var(--green);border-color:#2A5646}
.tag.state-1{color:#D9A05B;border-color:#553C22}

/* ---------- letter cells ---------- */
.slotwrap{position:relative;margin:4px 0 20px;cursor:text}
.slots{
  display:flex;flex-wrap:wrap;align-items:flex-end;gap:5px 3px;
  font-family:var(--mono);font-size:clamp(22px,6.2vw,34px);line-height:1
}
.cell{
  width:1.05em;height:1.42em;display:flex;align-items:center;justify-content:center;
  border-radius:5px;font-weight:500
}
.cell.given{color:var(--ink);background:#22304400}
.cell.blank{
  border:1.5px solid #45577200;border-bottom:2px solid var(--gold);
  background:var(--gold-soft);color:var(--gold)
}
.cell.blank.filled{background:#F0C05A2E}
.cell.cursor{box-shadow:0 0 0 1.5px var(--gold) inset;border-radius:5px}
.cell.gap{width:.45em;background:none;border:none}
.plain{color:var(--ink-dim);align-self:center;padding:0 .12em}
.slotwrap.ok .cell.blank{border-bottom-color:var(--green);background:#5FD3A628;color:var(--green)}
.slotwrap.bad .cell.blank{border-bottom-color:var(--red);background:#FF817226;color:var(--red)}
.slotwrap.bad{animation:shake .32s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
#typer{
  position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;background:none;
  font-size:16px;color:transparent;caret-color:transparent;padding:0
}

/* ---------- sentence ---------- */
.sentence{
  font-family:var(--mono);font-size:15px;line-height:1.85;color:var(--ink-dim);
  border-left:2px solid var(--line);padding:2px 0 2px 14px;margin:0 0 16px
}
.sentence b{color:var(--ink);font-weight:500}
.sentence .gap-mark{color:var(--gold);letter-spacing:.06em}
.sentence .syn{color:var(--ink);border-bottom:1px dotted var(--gold);padding-bottom:1px}

/* ---------- hint ---------- */
.hint{
  display:none;margin:0 0 16px;padding:13px 15px;border-radius:10px;
  background:var(--card-2);border:1px solid var(--line);font-size:13.5px;line-height:1.85;color:var(--ink-dim)
}
.hint.show{display:block}
.hint ol{margin:0;padding-left:1.25em}
.hint li::marker{color:var(--gold);font-family:var(--mono);font-size:12px}
.hint b{color:var(--ink);font-weight:500}
.hint .zh{color:var(--gold)}

/* ---------- feedback ---------- */
.feedback{min-height:24px;font-size:14px;margin:0 0 14px;display:flex;align-items:center;gap:8px}
.feedback.good{color:var(--green)}
.feedback.bad{color:var(--red)}
.feedback .ans{font-family:var(--mono);color:var(--ink);background:#28364B;padding:2px 8px;border-radius:5px}

/* ---------- buttons ---------- */
.actions{display:flex;flex-wrap:wrap;gap:8px}
button{
  appearance:none;font-family:var(--sans);font-size:14px;padding:10px 18px;border-radius:10px;
  cursor:pointer;border:1px solid var(--line);background:#1E293A;color:var(--ink);transition:.15s
}
button:hover{border-color:#41536E}
button.primary{background:var(--gold);border-color:var(--gold);color:#1A1200;font-weight:500}
button.primary:hover{filter:brightness(1.08)}
button.ghost{background:none;color:var(--ink-dim)}
button.ghost:hover{color:var(--ink)}
button:disabled{opacity:.4;cursor:not-allowed}

/* ---------- footer ---------- */
.foot{margin-top:22px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.keys{font-family:var(--mono);font-size:11.5px;color:var(--ink-faint);line-height:1.9}
kbd{
  border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 6px;
  font-family:var(--mono);font-size:11px;color:var(--ink-dim);background:#16202F
}
.danger{color:#C97B6E;border-color:#4A2E2A;background:#241A19}
.danger:hover{border-color:#6E403A}
.note{font-size:12px;color:var(--ink-faint);line-height:1.8;margin-top:14px}
.resume{
  margin:-6px 0 14px;padding:9px 13px;border-radius:9px;font-size:12.5px;
  background:#1B2536;border:1px solid #3A4A63;border-left:3px solid var(--gold);
  color:var(--ink-dim);transition:opacity .6s
}
.empty{text-align:center;padding:40px 10px;color:var(--ink-dim)}
.empty h2{font-family:var(--serif);font-weight:400;font-size:26px;margin:0 0 8px;color:var(--ink)}

@media(max-width:520px){
  .wrap{padding:16px 12px 48px}
  .card{padding:18px 15px 16px}
  .sentence{font-size:13.5px;line-height:1.8}
  .actions button{flex:1 1 auto;min-width:calc(50% - 4px)}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<div class="wrap">

<header>

  <h1>Complete <em>the</em> Words</h1>
  <p class="sub">873 個近年考出過的字附真實語境句，其餘依 TOEFL 同義詞題型出題。</p>

  <div class="meter">
    <div class="meter-top">
      <span class="meter-label">完成度</span>
      <span class="meter-pct" id="pct">0.0%</span>
    </div>
    <div class="bar"><i class="b-mastered" id="barM" style="width:0"></i><i class="b-review" id="barR" style="width:0"></i></div>
    <div class="legend">
      <span><i class="dot m"></i>已精熟 <b id="cM">0</b></span>
      <span><i class="dot r"></i>需複習 <b id="cR">0</b></span>
      <span><i class="dot n"></i>未練習 <b id="cN">0</b></span>
    </div>
  </div>
</header>

<div class="controls">
  <div class="ctl-row">
    <span class="ctl-label">練習範圍</span>
    <button class="chip" data-scope="all" aria-pressed="true">全部字彙</button>
    <button class="chip" data-scope="todo" aria-pressed="false">尚未精熟</button>
    <button class="chip" data-scope="wrong" aria-pressed="false">錯題本</button>
    <button class="chip" data-scope="new" aria-pressed="false">未練習過</button>
    <button class="chip" data-scope="hl" aria-pressed="false">近年考古題</button>
  </div>
  <div class="ctl-row">
    <span class="ctl-label">篩選與順序</span>
    <select id="selLetter" aria-label="字母"></select>
    <select id="selPos" aria-label="詞性"></select>
    <select id="selOrder" aria-label="出題順序">
      <option value="seq">依字典順序</option>
      <option value="rand">隨機出題</option>
    </select>
    <button class="chip" id="btnShuffle" hidden>重新洗牌</button>
    <button class="chip" id="btnAuto" aria-pressed="true">答對自動跳下一題</button>
  </div>
</div>

<p class="resume" id="resumeNote" style="display:none"></p>

<main id="stage"></main>

<div class="foot">
  <div class="keys">
    打滿字母自動判定 &nbsp;·&nbsp; <kbd>Enter</kbd> 下一題 &nbsp; <kbd>?</kbd> 提示 &nbsp; <kbd>Esc</kbd> 看答案
  </div>
  <button class="danger" id="btnReset">重設所有進度</button>
</div>

<p class="note" id="storeNote"></p>

</div>

/* ================= 儲存層 ================= */
const Store = (() => {
  const PREFIX = 'ctw_toefl_';
  const mem = {}, timers = {};
  let backend = 'memory';
  async function get(key){
    const k = PREFIX + key;
    try{
      if (window.storage && window.storage.get){
        backend = 'artifact';
        const r = await window.storage.get(k);
        return r ? JSON.parse(r.value) : null;
      }
    }catch(e){ backend = 'artifact'; return null; }
    try{
      localStorage.setItem(PREFIX + 'probe','1'); localStorage.removeItem(PREFIX + 'probe');
      backend = 'local';
      const v = localStorage.getItem(k);
      return v ? JSON.parse(v) : null;
    }catch(e){}
    backend = 'memory';
    return mem[k] ?? null;
  }
  function set(key, obj){
    const k = PREFIX + key;
    mem[k] = obj;
    clearTimeout(timers[k]);
    timers[k] = setTimeout(async () => {
      const str = JSON.stringify(obj);
      try{
        if (window.storage && window.storage.set){ await window.storage.set(k, str); return; }
      }catch(e){ return; }
      try{ localStorage.setItem(k, str); }catch(e){}
    }, 200);
  }
  return { get, set, kind: () => backend };
})();

/* ================= 挖空規則 ================= */
// 保留前 floor(長度/2) 個字母，其餘挖空；片語只挖最長的實詞
function buildMask(word){
  const runs = [];                       // 所有「括號外」的英文字母串
  let depth = 0, cur = null;
  for (let i = 0; i < word.length; i++){
    const ch = word[i];
    if (ch === '(') depth++;
    else if (ch === ')') depth--;
    if (/[A-Za-z]/.test(ch) && depth === 0){
      if (!cur){ cur = { s:i, e:i }; runs.push(cur); } else cur.e = i;
    } else cur = null;
  }
  if (!runs.length) return null;
  let target = runs[0];
  for (const r of runs) if ((r.e - r.s) > (target.e - target.s)) target = r;

  const full = word.slice(target.s, target.e + 1);
  let keep = Math.floor(full.length / 2);
  if (full.length - keep < 1) keep = full.length - 1;
  if (keep < 1) keep = 1;

  return {
    before: word.slice(0, target.s),
    after:  word.slice(target.e + 1),
    full,
    shown:  full.slice(0, keep),
    hidden: full.slice(keep)
  };
}

/* 採 TOEFL 同義詞題的實際問法：談論這個字，而不是把它硬塞進固定載體句。
   固定載體句（如 "Researchers had to ___ the samples"）無法同時對及物／不及物、
   可數／不可數、限定用法的形容詞都成立，會產出不合法或荒謬的句子。      */
const KINDLABEL = {
  verb:'the verb', noun:'the noun', adj:'the adjective', adv:'the adverb',
  prep:'the preposition', conj:'the connecting word', modal:'the modal verb',
  phrase:'the phrase', other:'the word'
};
const FRAMES = [
  ['In the passage, ', ' is closest in meaning to '],
  ['Here ', ' can be replaced by '],
  ['', ' in this reading carries the same sense as ']
];
const FRAMETAIL = ['.', ' without changing the meaning.', '.'];

const POSKIND = { '動詞':'verb','名詞':'noun','形容詞':'adj','副詞':'adv',
                  '介詞':'prep','連接詞':'conj','助動詞':'modal',
                  '介詞 副詞':'other','動詞 名詞':'other','':'other' };
const POSHINT = {
  verb:'這是<b>動詞</b>：句中會落在主詞之後、to 之後，或助動詞之後',
  noun:'這是<b>名詞</b>：句中會落在冠詞、形容詞之後，或當主詞／受詞',
  adj:'這是<b>形容詞</b>：句中會落在 be 動詞之後，或名詞之前',
  adv:'這是<b>副詞</b>：修飾動詞、形容詞或整句，抽掉也不影響句子結構',
  prep:'這是<b>介系詞</b>：後面必須接名詞或動名詞',
  conj:'這是<b>連接詞</b>：用來連接兩個子句或對等成分',
  modal:'這是<b>助動詞</b>：後面接原形動詞',
  phrase:'這是<b>片語</b>：整組一起使用，不能拆開替換',
  other:'這個字<b>身兼多種詞性</b>，要看它在句中的位置決定'
};

function questionOf(i){
  const [w, syn, pi, zh] = ITEMS[i];
  const posZh    = POS[pi] || '';
  const isPhrase = /\s/.test(w.replace(/\s*\(.*?\)\s*/g,'').trim());
  const kind     = POSKIND[posZh] ?? 'other';
  const label    = isPhrase ? KINDLABEL.phrase : KINDLABEL[kind];

  const parts = syn ? syn.split(/[；;]/).map(t => t.trim()).filter(Boolean) : [];
  const clueHtml = parts.length
      ? parts.slice(0,3).map(t => '\u201C' + esc(t) + '\u201D').join(' / ')
      : '\u300C' + esc(zh) + '\u300D';
  const clueText = parts.length ? parts.slice(0,3).join(' / ') : zh;

  const fi = parts.length ? (i % 3) : 0;
  const mask = buildMask(w);
  const base = { i, w, syn, zh, posZh, isPhrase, hl: HL.has(i),
                 pos: posZh || '片語', kind: isPhrase ? 'phrase' : kind,
                 clueHtml, clueText, mask };

  // 有真實語境句就用它當題幹，空格直接落在句子裡
  const sent = CTX[i];
  if (sent && mask){
    const at = sent.toLowerCase().indexOf(mask.full.toLowerCase());
    if (at >= 0){
      mask.shown = sent.substr(at, mask.shown.length);   // 沿用句子的大小寫
      return Object.assign(base, {
        real: true,
        pre:  esc(sent.slice(0, at)),
        post: esc(sent.slice(at + mask.full.length)),
        tail: '', clueHtml: clueHtml
      });
    }
  }

  const f = FRAMES[fi], tail = FRAMETAIL[fi];
  let pre = f[0] + label + ' ';
  if (!f[0]) pre = label.charAt(0).toUpperCase() + label.slice(1) + ' ';
  return Object.assign(base, { real:false, pre, post: f[1], tail });
}

// 固定種子的亂數產生器：同一個種子必定洗出同一個順序
function mulberry32(a){
  return function(){
    a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const newSeed = () => (Date.now() ^ Math.floor(Math.random() * 0x7FFFFFFF)) >>> 0;                       // 'scope|letter|pos' → 該組合下最後停留的單字

    if (c !== letter) return false;
  }
  if (posFilter !== 'all' && (POS[it[2]] || '') !== posFilter) return false;
  return true;
}

function go(d){
  if (!pool.length) return;
  if (d > 0 && scope !== 'all' && !passFilter(pool[cursor])){
    pool.splice(cursor, 1);
    if (cursor >= pool.length) cursor = 0;
    render(); return;
  }
  cursor += d; render();
}

function rebuildPool(announce, restart){
  // 優先順序：啟動時還原 → 這個範圍自己的書籤 → 目前這個字（該範圍還沒有書籤時）
  const bookmark = restart ? null : (resumeAt !== null ? resumeAt : marks[markKey()]);
  const carry = restart ? null : (q ? q.i : null);
  resumeAt = null;
  pool = [];
  for (let i = 0; i < ITEMS.length; i++) if (passFilter(i)) pool.push(i);
  if (order === 'rand'){
    if (!shuffleSeed) shuffleSeed = newSeed();
    const rnd = mulberry32(shuffleSeed);
    for (let k = pool.length - 1; k > 0; k--){
      const j = Math.floor(rnd() * (k + 1));
      [pool[k], pool[j]] = [pool[j], pool[k]];
    }
  }
  let at = (bookmark === undefined || bookmark === null) ? -1 : pool.indexOf(bookmark);
  if (at < 0 && carry !== null) at = pool.indexOf(carry);
  cursor = at >= 0 ? at : 0;
  render();
  if (announce && cursor > 0 && q){
    banner(`已回到「${SCOPE_LABEL[scope]}」上次停下的第 ${cursor + 1} 題。`);
  }
}

function banner(text){
  const n = $('#resumeNote');
  n.textContent = text;
  n.style.display = 'block'; n.style.opacity = '';
  clearTimeout(banner.t1); clearTimeout(banner.t2);
  banner.t1 = setTimeout(() => { n.style.opacity = '0'; }, 4500);
  banner.t2 = setTimeout(() => { n.style.display = 'none'; n.style.opacity = ''; }, 5100);
}

/* ================= 進度統計 ================= */
function updateMeter(){
  let m = 0, r = 0;
  for (const k in progress){ if (progress[k] === 2) m++; else if (progress[k] === 1) r++; }
  const total = ITEMS.length;
  $('#cM').textContent = m.toLocaleString();
  $('#cR').textContent = r.toLocaleString();
  $('#cN').textContent = (total - m - r).toLocaleString();
  $('#pct').textContent = (m / total * 100).toFixed(1) + '%';
  $('#barM').style.width = (m / total * 100) + '%';
  $('#barR').style.width = (r / total * 100) + '%';
}

function setState(i, v){
  if (v === 0) delete progress[i]; else progress[i] = v;
  Store.set('progress_v1', progress); updateMeter();
}

/* ================= 畫面 ================= */
function render(){
  if (!pool.length){
    stage.innerHTML = '<div class="card"><div class="empty"><h2>這個範圍沒有題目</h2>'
      + '<p>換一個練習範圍或篩選條件，就會有題目出現。</p></div></div>';
    q = null; saveSession(); return;
  }
  if (cursor >= pool.length) cursor = 0;
  if (cursor < 0) cursor = pool.length - 1;

  q = questionOf(pool[cursor]);
  revealed = false; tried = false;
  saveSession();
  const st = progress[q.i] || 0;
  const stateTag = st === 2 ? '<span class="tag state-2">已精熟</span>'
                 : st === 1 ? '<span class="tag state-1">需複習</span>'
                 : '<span class="tag">未練習</span>';

  const m = q.mask;
  const cells = [];
  for (const ch of m.before) cells.push(chPlain(ch));
  m.shown.split('').forEach(c => cells.push(`<span class="cell given">${c}</span>`));
  m.hidden.split('').forEach((c, k) => cells.push(`<span class="cell blank" data-k="${k}"></span>`));
  for (const ch of m.after) cells.push(chPlain(ch));

  stage.innerHTML = `
  <div class="card">
    <div class="card-head">
      <span class="counter">第 ${cursor + 1} / ${pool.length} 題 &nbsp;·&nbsp; #${q.i + 1}</span>
      <span class="tags">${q.hl ? '<span class="tag tag-hl">近年考出</span>' : ''}<span class="tag">${q.pos}</span>${q.isPhrase ? '<span class="tag">片語</span>' : ''}${stateTag}</span>
    </div>

    <p class="sentence${q.real ? ' real' : ''}">${q.pre}<b class="gap-mark">〔　〕</b>${q.post}${q.real ? '' : '<span class="syn">' + q.clueHtml + '</span>' + q.tail}</p>

    <div class="slotwrap" id="slotwrap">
      <div class="slots" id="slots">${cells.join('')}</div>
      <input id="typer" maxlength="${m.hidden.length}" autocomplete="off" autocapitalize="off"
             autocorrect="off" spellcheck="false" inputmode="text" aria-label="輸入缺少的字母">
    </div>

    <div class="hint" id="hint">
      <ol>
        <li>詞性線索：${POSHINT[q.kind]}${q.isPhrase && q.posZh ? '，字表標為<b>' + esc(q.posZh) + '</b>' : ''}。</li>
        <li>語意線索：同義詞是 <b>${q.clueHtml}</b>，中文是<span class="zh">「${esc(q.zh) || '—'}」</span>。</li>
        ${q.real ? '<li>這是原表標記<b>近年考出過</b>的字，題幹為真實語境句。</li>' : ''}
        <li>已給 <b>${m.shown}</b>，還缺 <b>${m.hidden.length}</b> 個字母。</li>
      </ol>
    </div>

    <p class="feedback" id="feedback">&nbsp;</p>

    <div class="actions">
      <button class="ghost" id="btnPrev">← 上一題</button>
      <button id="btnHint">提示</button>
      <button id="btnShow">看答案</button>
      <button class="ghost" id="btnNext">下一題 →</button>
    </div>
  </div>`;

  $('#btnHint').onclick  = () => $('#hint').classList.toggle('show');
  $('#btnShow').onclick  = reveal;
  $('#btnPrev').onclick  = () => go(-1);
  $('#btnNext').onclick  = () => go(1);
  $('#slotwrap').onclick = () => $('#typer').focus();

  const typer = $('#typer');
  typer.addEventListener('input', onType);
  typer.addEventListener('keydown', e => {
    if (e.key === 'Enter'){ e.preventDefault(); go(1); }
  });
  paint('');
  if (window.matchMedia('(min-width:700px)').matches) typer.focus();
}

const chPlain = ch => ch === ' ' ? '<span class="cell gap"></span>' : `<span class="plain">${esc(ch)}</span>`;

function paint(val){
  const blanks = stage.querySelectorAll('.cell.blank');
  blanks.forEach((el, k) => {
    el.textContent = val[k] ? val[k] : '';
    el.classList.toggle('filled', !!val[k]);
    el.classList.toggle('cursor', k === val.length && !revealed);
  });
}

function onType(e){
  const raw = e.target.value.replace(/[^A-Za-z]/g,'').toLowerCase();
  e.target.value = raw;
  $('#slotwrap').classList.remove('bad');
  paint(raw);
  if (raw.length === q.mask.hidden.length) check();
}

// 只由 onType 在字母填滿時呼叫；沒有手動送出，因此不會有「未填滿即判錯」的情況
function check(){
  if (revealed) return;
  const val = $('#typer').value.replace(/[^A-Za-z]/g,'').toLowerCase();
  if (val.length !== q.mask.hidden.length) return;
  const ok = val === q.mask.hidden.toLowerCase();
  const fb = $('#feedback'), sw = $('#slotwrap');
  if (ok){
    sw.classList.add('ok'); sw.classList.remove('bad');
    revealed = true;
    setState(q.i, tried ? 1 : 2);
    fb.className = 'feedback good';
    fb.innerHTML = `答對了 &nbsp;<span class="ans">${q.w}</span>&nbsp; ${esc(q.zh)}`
                 + (tried ? '&nbsp;·&nbsp;先前答錯，已留在錯題本' : '');
    $('#typer').disabled = true;
    const nx = $('#btnNext'); nx.classList.remove('ghost'); nx.classList.add('primary');
    if (autoNext) setTimeout(() => { if (revealed) go(1); }, 850);
  } else {
    tried = true;
    setState(q.i, 1);
    sw.classList.remove('ok'); void sw.offsetWidth; sw.classList.add('bad');
    fb.className = 'feedback bad';
    fb.innerHTML = `你輸入的是 <span class="ans">${esc(val)}</span>，還不對——再看一次線索，或按「提示」。`;
    setTimeout(() => { $('#typer').value = ''; paint(''); $('#typer').focus(); }, 700);
  }
}

function reveal(){
  if (revealed) return;
  revealed = true; tried = true;
  setState(q.i, 1);
  paint(q.mask.hidden);
  $('#slotwrap').classList.add('ok');
  $('#typer').disabled = true;
  $('#hint').classList.add('show');
  const fb = $('#feedback');
  fb.className = 'feedback';
  fb.innerHTML = `答案是 &nbsp;<span class="ans">${q.w}</span>&nbsp; ${esc(q.zh)} &nbsp;·&nbsp; 已放進錯題本`;
  const nx = $('#btnNext'); nx.classList.remove('ghost'); nx.classList.add('primary');
}

/* ================= 控制列 ================= */
document.querySelectorAll('[data-scope]').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('[data-scope]').forEach(x => x.setAttribute('aria-pressed','false'));
    b.setAttribute('aria-pressed','true');
    scope = b.dataset.scope; rebuildPool(true);
  };
});
$('#btnAuto').onclick = e => {
  autoNext = !autoNext;
  e.currentTarget.setAttribute('aria-pressed', String(autoNext));
  saveSession();
};
$('#selOrder').onchange = e => {
  order = e.target.value;
  syncShuffleBtn();
  rebuildPool(order === 'rand');
};
$('#btnShuffle').onclick = () => {
  shuffleSeed = newSeed();
  delete marks[markKey()];
  rebuildPool(false, true);
  banner('已重新洗牌，從新順序的第 1 題開始。');
};
function syncShuffleBtn(){ $('#btnShuffle').hidden = (order !== 'rand'); }
$('#selLetter').onchange = e => { letter = e.target.value; rebuildPool(true); };
$('#selPos').onchange = e => { posFilter = e.target.value; rebuildPool(true); };

$('#btnReset').onclick = () => {
  if (!confirm('確定要清空所有練習紀錄嗎？此動作無法復原。')) return;
  progress = {}; Store.set('progress_v1', progress); updateMeter(); rebuildPool();
};

document.addEventListener('keydown', e => {
  if (!q) return;
  if (e.key === '?'){ e.preventDefault(); $('#hint').classList.toggle('show'); }
  if (e.key === 'Escape'){ e.preventDefault(); reveal(); }
  if (e.key === 'Enter'){ e.preventDefault(); go(1); }
});

/* ================= 啟動 ================= */
(async function init(){
  const letters = [...new Set(ITEMS.map(x => x[0].replace(/[^A-Za-z]/g,'').charAt(0).toUpperCase()))].sort();
  $('#selLetter').innerHTML = '<option value="all">全部字母</option>'
    + letters.map(l => `<option value="${l}">${l} 開頭</option>`).join('');
  $('#selPos').innerHTML = '<option value="all">全部詞性</option>'
    + POS.filter(p => p).map(p => `<option value="${p}">${p}</option>`).join('');

  progress = await Store.get('progress_v1') || {};

  const sess = await Store.get('session_v1');
  if (sess){
    scope = sess.scope || 'all';
    order = sess.order || 'seq';
    autoNext = sess.auto !== false;
    document.querySelectorAll('[data-scope]').forEach(x =>
      x.setAttribute('aria-pressed', String(x.dataset.scope === scope)));
    $('#selOrder').value = order; syncShuffleBtn();
    $('#btnAuto').setAttribute('aria-pressed', String(autoNext));
    $('#selLetter').value = sess.letter || 'all'; letter    = $('#selLetter').value;
    $('#selPos').value    = sess.pos    || 'all'; posFilter = $('#selPos').value;
    marks = sess.marks || {};
    shuffleSeed = sess.seed || null;
    if (!sess.marks && typeof sess.i === 'number') marks[markKey()] = sess.i;  // 舊版紀錄
    if (typeof marks[markKey()] === 'number') resumeAt = marks[markKey()];
  }

  updateMeter();
  rebuildPool();

  if (cursor > 0 && q){
    banner(`已回到上次停下的地方：「${SCOPE_LABEL[scope]}」第 ${cursor + 1} 題。`);
  }

  const k = Store.kind();
  $('#storeNote').textContent = k === 'local'
    ? '每個練習範圍各自記住停在哪一題，互不干擾；答題紀錄與篩選設定也一併存在這台裝置的瀏覽器裡。換裝置或清除瀏覽資料會歸零。'
    : '目前這個環境無法長期保存紀錄；把檔案下載到電腦或手機後用瀏覽器開啟，題號與進度就會自動存起來。';
})();
</script>
</body>
</html>
